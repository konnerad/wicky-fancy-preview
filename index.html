<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wicky — Fancy preview</title>
  <meta name="robots" content="noindex">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #65ff00;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    .fancy-roulette {
      box-sizing: border-box; width: 100%; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; background: transparent;
    }
    .fancy-roulette__frame {
      border: 0; display: block;
      aspect-ratio: 9 / 16;
      height: min(82dvh, 820px); width: auto; max-width: 88vw;
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      background: #000;
    }
    @media (max-width: 640px) {
      .fancy-roulette__frame {
        height: min(72dvh, 720px); max-width: 80vw; border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="fancy-roulette" role="region" aria-label="Random TikTok using Fancy">
    <iframe
      class="fancy-roulette__frame"
      id="fancyRouletteFrame"
      src="about:blank"
      allow="autoplay; encrypted-media; picture-in-picture; web-share"

</html>
